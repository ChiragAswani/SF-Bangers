runtime: nodejs26
service: default
instance_class: F1

handlers:
  - url: /static
    static_dir: build/static
    secure: always
    http_headers:
      Cache-Control: "public, max-age=31536000, immutable"

  - url: /ping
    script: auto
    secure: always
  
  - url: /scrape-foopee-list
    script: auto
    secure: always

  - url: /similar-artists
    script: auto
    secure: always

  - url: /popular-in-sf
    script: auto
    secure: always

  - url: /auth/spotify/.*
    script: auto
    secure: always

  - url: /generate/.*
    script: auto
    secure: always

  - url: /.*
    static_files: build/index.html
    upload: build/index.html
    secure: always
    http_headers:
      Cache-Control: "no-cache, no-store, must-revalidate"
      Expires: "0"
      Pragma: "no-cache"
